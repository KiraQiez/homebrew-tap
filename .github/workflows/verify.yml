name: Verify Homebrew install

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      UV_PYTHON: "3.12"
    steps:
      - name: Install public formula
        id: install
        shell: bash
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/drift-brew-config
        run: |
          # Keep runner-provided third-party taps out of Homebrew's discovery.
          runner_taps="$(brew tap)"
          while IFS= read -r runner_tap; do
            case "$runner_tap" in ""|homebrew/*) continue ;; esac
            parked="$RUNNER_TEMP/drift-runner-taps/$runner_tap"
            mkdir -p "$(dirname "$parked")"
            mv "$(brew --repository "$runner_tap")" "$parked"
          done <<< "$runner_taps"
          formula=KiraQiez/tap/drift
          brew tap KiraQiez/tap
          tap="$(brew --repository KiraQiez/tap)"
          test "$(git -C "$tap" rev-parse HEAD)" = "$GITHUB_SHA"
          ruby -c "$tap/Formula/drift.rb"
          expected="$(sed -nE 's/^  version "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' "$tap/Formula/drift.rb")"
          test -n "$expected"
          brew install "$formula"
          brew test "$formula"
          executable="$(brew --prefix "$formula")/bin/drift"
          test "$("$executable" --version)" = "drift $expected"
          echo "tag=v$expected" >> "$GITHUB_OUTPUT"
          echo "DRIFT_TEST_EXECUTABLE=$executable" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: KiraQiez/Drift
          ref: ${{ steps.install.outputs.tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
      - name: Run Drift console contract
        run: uv run --locked pytest -q tests/integration/test_console_contract.py
