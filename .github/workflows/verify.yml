name: Verify Homebrew install

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      UV_PYTHON: "3.12"
    steps:
      - name: Install public formula
        id: install
        shell: bash
        run: |
          formula=KiraQiez/tap/drift
          brew install "$formula"
          brew readall --syntax KiraQiez/tap
          brew test "$formula"
          executable="$(brew --prefix "$formula")/bin/drift"
          version="$("$executable" --version)"
          if [[ ! "$version" =~ ^drift\ ([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            exit 1
          fi
          echo "tag=v${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "DRIFT_TEST_EXECUTABLE=$executable" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: KiraQiez/Drift
          ref: ${{ steps.install.outputs.tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
      - name: Run Drift console contract
        run: uv run --locked pytest -q tests/integration/test_console_contract.py
